services:
  - type: web
    name: wabi-seminar-backend
    env: node
    buildCommand: npm install && cd ../frontend && npm install && VITE_API_URL=/api npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: mysql://4Qe8CQZuyB1e2jm.root:KI5AsN7Edys2nXJx@gateway01.us-west-2.prod.aws.tidbcloud.com:4000/seminar
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://wabiskills-seminar.onrender.com/api/auth/google/callback
      # First entry = public app URL (used for Google OAuth return + browser origin). Add your API host too if you open the app from both.
      - key: CORS_ORIGIN
        value: https://wabiskills-seminar-1.onrender.com,https://wabiskills-seminar.onrender.com
      # Optional override for OAuth return URL; otherwise derived from GOOGLE_CALLBACK_URL (strip /api/auth/google/callback).
      - key: PUBLIC_APP_URL
        sync: false
